openapi: 3.0.3
info:
  title: RAG Service Example API
  version: 0.1.0
paths:
  /healthz:
    get:
      responses:
        "200":
          description: ok
  /v1/query:
    post:
      parameters:
        - name: X-Tenant-ID
          in: header
          required: true
          schema:
            type: string
        - name: X-User-ID
          in: header
          required: true
          schema:
            type: string
        - name: X-Roles
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: query response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: invalid request
        "500":
          description: internal error
components:
  schemas:
    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        scene:
          type: string
        max_results:
          type: integer
          minimum: 1
          maximum: 10
    Citation:
      type: object
      properties:
        doc_id:
          type: string
        chunk_id:
          type: string
        title:
          type: string
        url:
          type: string
        score:
          type: number
    QueryResponse:
      type: object
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        trace_id:
          type: string
        refused:
          type: boolean
        reason:
          type: string

